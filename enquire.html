<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hidden Help — Donor Enquiry</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 24px 20px;
            min-height: 100vh;
        }
        .card {
            background: var(--tg-theme-secondary-bg-color, #f5f5f5);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
        }
        .label {
            font-size: 13px;
            color: var(--tg-theme-hint-color, #888);
            margin-bottom: 4px;
        }
        .value {
            font-size: 20px;
            font-weight: 600;
        }
        .items-label {
            font-size: 13px;
            color: var(--tg-theme-hint-color, #888);
            margin-top: 12px;
            margin-bottom: 4px;
        }
        .items-value {
            font-size: 15px;
            line-height: 1.5;
        }
        .message-card {
            background: var(--tg-theme-secondary-bg-color, #f5f5f5);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .message-label {
            font-size: 13px;
            color: var(--tg-theme-hint-color, #888);
            margin-bottom: 8px;
        }
        .message-text {
            font-size: 15px;
            line-height: 1.5;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            margin-bottom: 12px;
        }
        .btn-primary {
            background: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
        }
        .btn-primary:active { opacity: 0.8; }
        .status {
            text-align: center;
            padding: 40px 20px;
            font-size: 15px;
            color: var(--tg-theme-hint-color, #888);
        }
        .status-icon { font-size: 40px; margin-bottom: 12px; }
        .error { color: #cc0000; }
        #main-section { display: none; }
        #error-section { display: none; }
    </style>
</head>
<body>

    <div id="loading" class="status">
        <div class="status-icon">📋</div>
        <div>Loading...</div>
    </div>

    <div id="error-section" class="status">
        <div class="status-icon">⚠️</div>
        <div id="error-msg" class="error"></div>
    </div>

    <div id="main-section">
        <div class="card">
            <div class="label" id="code-label"></div>
            <div class="value" id="donor-name"></div>
            <div class="items-label">Items</div>
            <div class="items-value" id="items-value"></div>
        </div>
        <div class="message-card">
            <div class="message-label">SMS message to donor</div>
            <div class="message-text" id="sms-message"></div>
        </div>
        <a id="sms-btn" href="#" class="btn btn-primary">📱 Send enquiry SMS</a>
    </div>

    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            Telegram.WebApp.ready();
            Telegram.WebApp.expand();
        }

        const params = new URLSearchParams(window.location.search);
        const code   = params.get('code');
        const donor  = params.get('donor') || 'Donor';
        const number = params.get('number');
        const items  = params.get('items') || '';

        const mobileMatch = number && number.match(/^07\d{9}$/);

        document.getElementById('loading').style.display = 'none';

        if (!code || !mobileMatch) {
            document.getElementById('error-section').style.display = 'block';
            document.getElementById('error-msg').textContent =
                !mobileMatch
                    ? 'No valid UK mobile number found for this pickup.'
                    : 'Missing parameters. Please use the button in the bot.';
        } else {
            const smsBody = `Hello ${donor}. Sorry it's taken a while to get in touch. ` +
                `We are delivering in your area today and would like to collect ` +
                `the items below you have kindly offered for donation. Please ` +
                `could you call or message me on this number if this is ` +
                `convenient? Many thanks.\n\n${items}`;

            document.getElementById('code-label').textContent   = code;
            document.getElementById('donor-name').textContent   = donor;
            document.getElementById('items-value').textContent  = items;
            document.getElementById('sms-message').textContent  = smsBody;
            document.getElementById('sms-btn').href             = `sms:${number}&body=${encodeURIComponent(smsBody)}`;

            document.getElementById('main-section').style.display = 'block';
        }
    </script>
</body>
</html>
