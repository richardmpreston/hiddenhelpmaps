<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hidden Help ETA</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 24px 20px;
            min-height: 100vh;
        }
        .card {
            background: var(--tg-theme-secondary-bg-color, #f5f5f5);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .ref {
            font-size: 13px;
            color: var(--tg-theme-hint-color, #888);
            margin-bottom: 4px;
        }
        .client {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 12px;
        }
        .eta-label {
            font-size: 13px;
            color: var(--tg-theme-hint-color, #888);
            margin-bottom: 4px;
        }
        .eta-value {
            font-size: 28px;
            font-weight: 700;
            color: var(--tg-theme-link-color, #2481cc);
        }
        .eta-mins {
            font-size: 15px;
            color: var(--tg-theme-hint-color, #888);
            margin-top: 2px;
        }
        .message-card {
            background: var(--tg-theme-secondary-bg-color, #f5f5f5);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
        }
        .message-label {
            font-size: 13px;
            color: var(--tg-theme-hint-color, #888);
            margin-bottom: 8px;
        }
        .message-text {
            font-size: 15px;
            line-height: 1.5;
        }
        .send-btn {
            display: block;
            width: 100%;
            padding: 16px;
            background: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
        }
        .send-btn:active {
            opacity: 0.8;
        }
        .error {
            color: #cc0000;
            text-align: center;
            padding: 40px 20px;
            font-size: 15px;
        }
    </style>
</head>
<body>
    <div id="content"></div>

    <script>
        // Initialise Telegram Web App
        if (window.Telegram && window.Telegram.WebApp) {
            Telegram.WebApp.ready();
            Telegram.WebApp.expand();
        }

        // Parse URL parameters
        const params = new URLSearchParams(window.location.search);
        const ref     = params.get('ref');
        const client  = params.get('client');
        const number  = params.get('number');
        const eta     = params.get('eta');
        const mins    = params.get('mins');
        const msg     = params.get('msg');

        const content = document.getElementById('content');

        if (!ref || !number || !eta || !msg) {
            content.innerHTML = '<div class="error">⚠️ Missing parameters.<br>Please use the /eta command in the bot.</div>';
        } else {
            const smsLink = `sms:${number}&body=${encodeURIComponent(msg)}`;
            content.innerHTML = `
                <div class="card">
                    <div class="ref">Ref ${ref}</div>
                    <div class="client">${client || 'Client'}</div>
                    <div class="eta-label">Estimated arrival</div>
                    <div class="eta-value">${eta}</div>
                    <div class="eta-mins">${mins} minutes from now</div>
                </div>
                <div class="message-card">
                    <div class="message-label">SMS message to client</div>
                    <div class="message-text">${msg}</div>
                </div>
                <a href="${smsLink}" class="send-btn">📱 Send SMS to client</a>
            `;
        }
    </script>
</body>
</html>
